# Optional containerized dev. `make dev` (native) is the primary path; this
# exists for machines without python/node/ffmpeg installed.
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      RUN_WORKER: "1"
  ui:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api:8000
    depends_on:
      - api
